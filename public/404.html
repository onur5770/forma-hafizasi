<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-night:#0a2418; --pitch-night-2:#0f3120; --card-surface:#123a26; --card-surface-2:#16452e;
    --turf:#4ade80; --floodlight:#f4f7f2; --floodlight-dim:#b9c9bd; --amber:#f2b705;
    --line:rgba(244,247,242,0.12); --line-strong:rgba(244,247,242,0.22);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100vh;
    background: repeating-linear-gradient(90deg, var(--pitch-night) 0 64px, var(--pitch-night-2) 64px 128px);
    color:var(--floodlight); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background: linear-gradient(180deg, var(--card-surface), var(--card-surface-2));
    border:1px solid var(--line-strong); border-radius:18px;
    padding:40px 32px; max-width:400px; width:100%; text-align:center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7);
  }
  .flag{
    width:56px; height:70px; margin:0 auto 20px;
    background: linear-gradient(155deg, var(--amber), #c98f00);
    clip-path: polygon(0 0, 100% 15%, 100% 100%, 0 85%);
    box-shadow: 0 8px 18px rgba(242,183,5,0.35);
  }
  h1{ font-family:'Teko',sans-serif; font-weight:700; font-size:56px; margin:0; letter-spacing:.02em; color:var(--amber); line-height:1; }
  h2{ font-family:'Teko',sans-serif; font-weight:600; font-size:24px; text-transform:uppercase; margin:8px 0 14px; }
  p{ font-size:14px; color:var(--floodlight-dim); line-height:1.6; margin:0 0 22px; }
  a.btn{
    display:inline-block; padding:12px 28px; border-radius:10px;
    background:var(--turf); color:#06210f; font-weight:700; font-size:15px;
    text-decoration:none;
  }
  a.btn:hover{ background:#6cec9b; }
</style>
</head>
<body>
  <div class="card">
    <div class="flag"></div>
    <h1>404</h1>
    <h2>Ofsayt!</h2>
    <p>Aradığın sayfa sahada yok — yanlış pozisyondasın gibi görünüyor.</p>
    <a class="btn" href="/">Oyuna Dön</a>
  </div>
</body>
</html>
